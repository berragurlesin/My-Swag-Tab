<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My SWAG Tab</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>

    <div id="stickers-container"></div>

    <main id="app">
      <div id="clock" class="clock-display">
        <img id="h1" src="./digits/0.png" alt="0" />
        <img id="h2" src="./digits/0.png" alt="0" />
        <img class="colon" src="./digits/Colon.png" alt=":" />
        <img id="m1" src="./digits/0.png" alt="0" />
        <img id="m2" src="./digits/0.png" alt="0" />
        <img class="colon" src="./digits/Colon.png" alt=":" />
        <img id="s1" src="./digits/0.png" alt="0" />
        <img id="s2" src="./digits/0.png" alt="0" />
      </div>

      <section id="search-widget" class="card">
        <form action="https://www.google.com/search" method="GET" target="_blank">
          <input 
            type="text" 
            name="q" 
            placeholder="write something or paste a link.." 
            required
            autocomplete="off"
          />
          <button type="submit">search</button>
        </form>
      </section>

      <div class="shortcuts-card">
        <div class="shortcuts-banner">
          <span>fav shortcuts ♡</span>
        </div>
        
        <div id="shortcuts-grid" class="shortcuts-grid">
        </div>
      </div>

      <div id="app-modal" class="modal-overlay hidden">
        <div class="modal-content">
          <h3>add your fav shortcut</h3>
          <input type="text" id="app-name-input" placeholder="site name" />
          <input type="url" id="app-url-input" placeholder="URL" />
          <div class="modal-buttons">
            <button id="save-app-btn">OK</button>
            <button id="close-modal-btn">cancel</button>
          </div>
        </div>
      </div>

      <section id="nasa-card" class="nasa-card">
        <h2 id="nasa-title">Loading space image...</h2>
        <div id="nasa-media-container">
          <img id="nasa-image" src="" alt="NASA APOD" style="display: none;" />
        </div>
        <p id="nasa-explanation"></p>
      </section>
    </main>

    <button id="settings-toggle-btn" class="settings-btn" title="Settings">
      <img src="/settings.png" alt="Settings" id="settings-icon-img" />
    </button>

    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal-content settings-modal-content">
        <h3>background settings</h3>
        
        <div class="settings-body">
          <p class="settings-label">you can choose:</p>
          <div class="preset-backgrounds">
            <button class="bg-option" data-bg="default">blue</button>
            <button class="bg-option" data-bg="#e91e63">fuchsia</button>
            <button class="bg-option" data-bg="#fb8c00">orange</button>
            <button class="bg-option" data-bg="#00cdd3">turquoise</button>
            <button class="bg-option" data-bg="https://i.pinimg.com/1200x/b2/4a/01/b24a012ab60770087cfca54a26aee70b.jpg">palms</button>
            <button class="bg-option" data-bg="https://i.pinimg.com/1200x/a8/5a/26/a85a262035f6c4728ac6f5bb6075538a.jpg">striped</button>
          </div>

          <p class="settings-label">or upload yours:</p>
          <div class="custom-bg-upload">
            <label for="bg-file-input" class="upload-btn">click to select</label>
            <input type="file" id="bg-file-input" accept="image/*" style="display: none;" />
          </div>

          <hr class="solid-hr" />
          <h3>sticker settings</h3>
          <div class="custom-bg-upload">
            <label for="sticker-file-input" class="upload-btn">add new sticker</label>
            <input type="file" id="sticker-file-input" accept="image/png" style="display: none;" />
          </div>
          <div id="sticker-list-preview" class="sticker-preview-grid">
    
          </div>

        </div>

        <div class="modal-buttons">
          <button id="save-settings-btn">OK</button>
          <button id="close-settings-btn">cancel</button>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
